<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <title>To-do list</title>
    <link rel="icon" href="images/edit icon.png" type="image/x-icon">
</head>

<body class="m-0 p-0 text-white">
    <div id="container">
        <img src="images/leaf-7215867_1920.jpg" class="fixed top-0 left-0 w-full h-full object-cover z-[-1] blur-sm"
            alt="Background Image">
        <div id="Todos-container"
            class="border-solid border-black rounded-2xl shadow-md hover:shadow-2xl hover:scale-105 transition ease-in-out flex flex-col items-center gap-7 ">
            <h1 id="title" class="text-4xl">Todo List</h1>
            <div id="todos-counter">
                <h2 class="text-2xl p-5 rounded-2xl border text-center">keep it up!
                    <span id="todo-count" class="border rounded-full p-1.5 text-2xl">0/0</span>
                    <div id="progress-bar">
                        <meter max="16" value="1" class="rounded-3xl mt-5" id="progress"></meter>
                    </div>
                </h2>
            </div>
            <div id="inputs" class="flex gap-3 p-3 rounded-xl">
                <input type="text" id="todo-input" placeholder="Sleeping"
                    class="border-none focus:outline-none hover:scale-105 transition ease-in-out">
                <abbr title="Add Todo">
                    <button id="add-todo-btn"
                        class="focus:outline-none rounded-md hover:scale-125 transition ease-in-out w-10 h-10 p-0"> <img
                            src="images/plus icon.png" alt="Add" class="w-2xl h-2xl"></button></abbr>
            </div>
            <div id="todo-list-container">
                <img src="images/to do list image.png" alt="Todo List Image" id="To-do-list-img">
                <ul id="todo-list" class="gap-3 flex flex-col ">
                </ul>
            </div>
        </div>
    </div>
</body>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>

</html>
